[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chemhelper"
version = "1.0.0"
description = "General chemistry answers in one line of Python, and the worked solution in one more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dave Rosenman" }]
requires-python = ">=3.10"
dependencies = ["pandas>=1.3"]
keywords = ["chemistry", "education", "stoichiometry", "ideal gas", "molar mass"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/drosenman/chemhelper"
Documentation = "https://drosenman.github.io/chemhelper/"
Changelog = "https://github.com/drosenman/chemhelper/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["src"]
