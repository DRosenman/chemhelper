name: Docs
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[docs]"
      - name: Check that every example in the docs is up to date
        run: python tools/docs_examples.py
      - run: mkdocs gh-deploy --force --strict
